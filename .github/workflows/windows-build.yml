name: Build C# applications

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build TypeScript Web UI
        shell: powershell
        run: |
          corepack enable
          pnpm --dir src-web-ui install --no-frozen-lockfile
          pnpm --dir src-web-ui run build
          New-Item -ItemType Directory -Force src-csharp\Veles.Launcher\WebUi | Out-Null
          Copy-Item src-web-ui\index.html,src-web-ui\styles.css,src-web-ui\dist\main.js src-csharp\Veles.Launcher\WebUi\ -Force
      - name: Build core library
        shell: powershell
        run: msbuild src-csharp\Veles.Core\Veles.Core.csproj /t:Restore,Build /p:Configuration=Release /p:Platform=AnyCPU /p:OutputPath=bin\Release\ /p:BaseOutputPath=bin\ /p:TargetFrameworkVersion=v4.8 /m
      - name: Stage core library for tests
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force src-csharp\Veles.Core.Tests\bin\Release | Out-Null
          Copy-Item src-csharp\Veles.Core\bin\Release\Veles.Core.dll src-csharp\Veles.Core.Tests\bin\Release\Veles.Core.dll -Force
      - name: Build core tests
        shell: powershell
        run: msbuild src-csharp\Veles.Core.Tests\Veles.Core.Tests.csproj /t:Build /p:BuildProjectReferences=false /p:Configuration=Release /p:Platform=AnyCPU /p:OutputPath=bin\Release\ /p:BaseOutputPath=bin\ /p:TargetFrameworkVersion=v4.8 /m
      - name: Run core tests
        shell: powershell
        run: |
          Copy-Item src-csharp\Veles.Core\bin\Release\Veles.Core.dll src-csharp\Veles.Core.Tests\bin\Release\Veles.Core.dll -Force
          .\src-csharp\Veles.Core.Tests\bin\Release\Veles.Core.Tests.exe
      - name: Stage shared library
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force src-csharp\Veles.Launcher\bin\Release, src-csharp\Veles.BuildPublisher\bin\Release, src-csharp\Veles.Updater\bin\Release | Out-Null
          Copy-Item src-csharp\Veles.Core\bin\Release\Veles.Core.dll src-csharp\Veles.Launcher\bin\Release\Veles.Core.dll -Force
          Copy-Item src-csharp\Veles.Core\bin\Release\Veles.Core.dll src-csharp\Veles.BuildPublisher\bin\Release\Veles.Core.dll -Force
          Copy-Item src-csharp\Veles.Core\bin\Release\Veles.Core.dll src-csharp\Veles.Updater\bin\Release\Veles.Core.dll -Force
      - name: Build launcher
        shell: powershell
        run: msbuild src-csharp\Veles.Launcher\Veles.Launcher.csproj /t:Restore,Build /p:BuildProjectReferences=false /p:Configuration=Release /p:Platform=AnyCPU /p:OutputPath=bin\Release\ /p:BaseOutputPath=bin\ /p:TargetFrameworkVersion=v4.8 /m
      - name: Verify CefSharp runtime output
        shell: powershell
        run: |
          $output = Resolve-Path src-csharp\Veles.Launcher\bin\Release
          $required = @('libcef.dll','icudtl.dat','resources.pak','chrome_100_percent.pak','chrome_200_percent.pak','CefSharp.Core.Runtime.dll','CefSharp.BrowserSubprocess.exe','CefSharp.BrowserSubprocess.Core.dll','locales\ru.pak')
          foreach ($relative in $required) {
            $file = Join-Path $output $relative
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing CEF runtime file: $relative" }
          }
          $libcef = Get-Item (Join-Path $output 'libcef.dll')
          if ($libcef.Length -lt 100MB) { throw "libcef.dll is unexpectedly small: $($libcef.Length) bytes" }
          Write-Host "CEF runtime verified: $($libcef.Length) bytes"
      - name: Build admin publisher
        shell: powershell
        run: msbuild src-csharp\Veles.BuildPublisher\Veles.BuildPublisher.csproj /t:Build /p:BuildProjectReferences=false /p:Configuration=Release /p:Platform=AnyCPU /p:OutputPath=bin\Release\ /p:BaseOutputPath=bin\ /p:TargetFrameworkVersion=v4.8 /m
      - name: Build updater
        shell: powershell
        run: msbuild src-csharp\Veles.Updater\Veles.Updater.csproj /t:Build /p:BuildProjectReferences=false /p:Configuration=Release /p:Platform=AnyCPU /p:OutputPath=bin\Release\ /p:BaseOutputPath=bin\ /p:TargetFrameworkVersion=v4.8 /m
      - name: Build custom Veles Setup
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME.Substring(1) } else { (Select-String -Path src-csharp\Veles.Core\ProductInfo.cs -Pattern 'VersionText = "([^"]+)"').Matches.Groups[1].Value }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Could not determine launcher version for custom Setup' }
          msbuild src-csharp\Veles.Setup\Veles.Setup.csproj /t:Build /p:BuildProjectReferences=false /p:Configuration=Release /p:Platform=AnyCPU /p:OutputPath=bin\Release\ /p:BaseOutputPath=bin\ /p:TargetFrameworkVersion=v4.8 /m
          py -3 tools_pack_setup.py $version
      - name: Upload application binaries and setup files
        uses: actions/upload-artifact@v4
        with:
          name: veles-csharp-release
          path: |
            src-csharp/Veles.Launcher/bin/Release/**
            src-csharp/Veles.BuildPublisher/bin/Release/**
            artifacts/setup/*.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "Veles Launcher $tag - CEF Web UI"
          @"
          TypeScript Web UI inside the native Launcher.
          Windows 7-11 compatible through CEF 109.
          Build update is mandatory before Minecraft launch.
          "@ | Set-Content release-notes.md
          gh release create $tag --verify-tag --title $title --notes-file release-notes.md artifacts/setup/VelesLauncherSetup.exe artifacts/setup/VelesBuildPublisherSetup.exe
